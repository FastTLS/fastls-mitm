name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: Development feedback or frozen candidate validation
        type: choice
        options: [quick, candidate]
        default: candidate

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GOWORK: 'off'

jobs:
  plan:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      quality: ${{ steps.plan.outputs.quality }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate selector and rejection gates
        run: python -m unittest discover -s scripts -p test_ci_plan.py -v
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_plan.py
      - name: Validate release evidence rejection gates
        run: python -m unittest discover -s scripts -p test_release_gate.py -v
      - name: Test immutable input and recovery boundaries
        run: python -m unittest discover -s scripts -p "test_*inputs.py" -v
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

  dependency-policy:
    needs: plan
    if: needs.plan.outputs.mode == 'quick' || needs.plan.outputs.mode == 'candidate'
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: true
      - name: Verify module integrity
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Enforce standalone dependencies
        shell: bash
        run: |
          if grep -Eq '^[[:space:]]*replace[[:space:]]' go.mod; then
            echo 'replace directives are not allowed in the standalone module' >&2
            exit 1
          fi
          if go mod graph | grep -F 'github.com/FastTLS/fhttp'; then
            echo 'legacy fhttp dependency remains in the module graph' >&2
            exit 1
          fi

  test:
    timeout-minutes: 20
    if: needs.plan.outputs.mode == 'quick' || needs.plan.outputs.mode == 'candidate'
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    needs: [plan, dependency-policy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Test
        run: go test -tags mitm_policy_e2e ./...
      - name: Vet
        run: go vet ./...
      - name: Build all packages
        run: go build ./...

  quality:
    timeout-minutes: 20
    if: needs.plan.outputs.quality == 'true'
    name: Race, coverage and CLI smoke test
    needs: [plan, dependency-policy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: true
      - name: Race and coverage in one execution
        run: go test -race -tags mitm_policy_e2e -covermode=atomic -coverprofile=coverage.out ./...
      - name: Policy hop and control-header fuzz
        run: go test -run '^$' -fuzz '^FuzzMITMPolicyHeaders$' -fuzztime 20s .
      - name: Cumulative tunnel traffic budget fuzz
        run: go test -run '^$' -fuzz '^FuzzPolicyTrafficBudget$' -fuzztime 20s .
      - name: Coverage
        run: |
          go tool cover -func=coverage.out
      - name: CLI smoke test
        run: |
          go build -o build/fastls-mitm .
          ./build/fastls-mitm -version
      - name: Upload coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 14
          if-no-files-found: error

  accepted:
    name: Accepted validation plan
    if: always()
    needs: [plan, dependency-policy, test, quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Reject failures, cancellations, missing or unexpected skipped jobs
        env:
          VALIDATION_PLAN: ${{ needs.plan.outputs.plan }}
          VALIDATION_JOBS: ${{ toJSON(needs) }}
        run: python scripts/ci_plan.py --gate
