name: Verify reusable service validation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recompute production inputs and trusted success evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ROOT: ${{ runner.temp }}/delivery-gate
        run: python scripts/release_gate.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: service-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delivery-gate/
          if-no-files-found: warn
